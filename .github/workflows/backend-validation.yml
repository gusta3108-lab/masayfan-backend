name: Backend validation

on:
  pull_request:
    branches: ["main", "feature/admin-test-orders"]
  push:
    branches: ["main", "feature/admin-test-orders", "feature/stock-inventory-backend"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check server.js
