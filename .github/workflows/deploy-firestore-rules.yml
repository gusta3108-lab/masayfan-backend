name: Deploy Firestore rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/verified-mercadopago-payments
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-firestore-rules-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish Firestore rules to production
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Firebase configuration
        run: |
          test -s firestore.rules
          node -e "const c=require('./firebase.json'); if(c.firestore?.rules !== 'firestore.rules') process.exit(1)"

      - name: Check available authentication
        id: credentials
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$SERVICE_ACCOUNT" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            echo "method=json" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Firebase deployment credential is configured in the firebase-production environment. Configure the existing service-account JSON secret or both OIDC variables; no rules were deployed."
            exit 1
          fi

      - name: Authenticate with existing OIDC configuration
        id: auth_oidc
        if: steps.credentials.outputs.method == 'oidc'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Authenticate with existing service-account secret
        id: auth_json
        if: steps.credentials.outputs.method == 'json'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Deploy Firestore security rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth_oidc.outputs.credentials_file_path || steps.auth_json.outputs.credentials_file_path }}
        run: npx --yes firebase-tools@14.22.0 deploy --only firestore:rules --project masayfantasias --non-interactive

      - name: Report deployment target
        run: echo "Firestore rules deployment command completed for Firebase project masayfantasias."
