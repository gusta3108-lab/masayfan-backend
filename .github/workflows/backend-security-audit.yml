name: Backend dependency security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/dependency-audit-2026]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit proposed branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Record npm version
        run: npm --version
      - name: Install dependencies without running package scripts
        run: npm install
      - name: Audit proposed dependency tree
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); console.log(JSON.stringify({metadata:r.metadata, vulnerabilities:r.vulnerabilities}, null, 2)); if (!r.metadata) process.exit(2); if ((r.metadata.vulnerabilities?.critical || 0) + (r.metadata.vulnerabilities?.high || 0) + (r.metadata.vulnerabilities?.moderate || 0) > 0) process.exitCode=1"
      - name: Preserve proposed audit report and resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposed-branch-security-audit
          path: |
            npm-audit.json
            package-lock.json
          if-no-files-found: warn
          retention-days: 14

  production-main-audit:
    name: Reproduce Render main dependency tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Render production branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Record npm version
        run: npm --version
      - name: Install dependencies as Render does, without lifecycle scripts
        run: npm install --ignore-scripts --no-audit
      - name: Audit exact production-main dependency tree
        run: |
          npm audit --json > npm-audit-main.json || true
          node -e "const r=require('./npm-audit-main.json'); console.log(JSON.stringify({metadata:r.metadata, vulnerabilities:r.vulnerabilities}, null, 2)); if (!r.metadata) process.exit(2); if ((r.metadata.vulnerabilities?.critical || 0) + (r.metadata.vulnerabilities?.high || 0) + (r.metadata.vulnerabilities?.moderate || 0) > 0) process.exitCode=1"
      - name: Preserve production-main audit report and resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-main-security-audit
          path: |
            npm-audit-main.json
            package-lock.json
          if-no-files-found: warn
          retention-days: 14
