name: Backend validation

on:
  push:
    branches:
      - main
      - fix/verified-mercadopago-payments
      - deploy/inventory-live
  pull_request:
    branches:
      - main
      - fix/verified-mercadopago-payments

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: node --check server.js && node --check lib/customer-account.js && node --check scripts/release-expired-inventory.js
      - name: Run tests
        run: npm test
