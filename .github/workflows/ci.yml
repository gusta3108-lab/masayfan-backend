name: Backend validation

on:
  push:
    branches:
      - main
      - fix/verified-mercadopago-payments
      - deploy/inventory-live
      - test/current-inventory-emulator
  pull_request:
    branches:
      - main
      - fix/verified-mercadopago-payments

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Report dependency audit findings (diagnostic only)
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})}))},null,2))"
      - name: Check JavaScript syntax
        run: node --check server.js && node --check lib/customer-account.js && node --check lib/inventory.js && node --check scripts/release-expired-inventory.js
      - name: Run unit tests
        run: npm test
      - name: Run Firestore inventory integration tests
        run: |
          printf '%s' '{"emulators":{"auth":{"port":9099},"firestore":{"port":8080},"ui":{"enabled":false}}}' > firebase.json
          npx --yes firebase-tools@14.22.0 emulators:exec --only firestore,auth --project masayfantasias "node --test test/http-checkout-emulator.integration.js && node --test test/inventory-emulator.integration.js"
